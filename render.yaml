services:
  - type: web
    name: issueflow-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: issueflow-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false

databases:
  - name: issueflow-db
    plan: free
